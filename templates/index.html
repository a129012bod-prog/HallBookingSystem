<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام حجز القاعات والمعامل</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        input[type="datetime-local"] {
            direction: ltr;
            text-align: right;
        }
        .trainee-badge {
            font-size: 0.9rem;
            margin: 2px;
        }
    </style>
</head>
<body class="bg-body text-body d-flex flex-column min-vh-100">

    <!-- شريط علوي لتبديل الثيم -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
        <div class="container-fluid justify-content-between">
            <span class="navbar-brand mb-0 h1">إدارة القاعات والمعامل</span>
            <button class="btn btn-outline-secondary btn-sm" id="themeToggleBtn" onclick="toggleTheme()">
                🌙 تبديل الثيم (مظلم/فاتح)
            </button>
        </div>
    </nav>

    <div class="container py-3 flex-grow-1">
        <h1 class="text-center mb-4">نظام حجز القاعات والمعامل</h1>

        <!-- قائمة القاعات والمعامل -->
        <div class="row" id="rooms-container">
            <!-- سيتم تعبئة الغرف ديناميكياً -->
        </div>
    </div>

    <!-- تذييل الصفحة: أسماء المتدربين في الأسفل -->
    <footer class="mt-auto py-3 bg-body-tertiary border-top">
        <div class="container text-center">
            <h6 class="text-primary mb-2">فريق العمل / المتدربون:</h6>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 trainee-badge">عبدالرحمن مهدي</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 trainee-badge">زياد ابو شعفه</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 trainee-badge">إياد ضامري</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 trainee-badge">وسيم رفاعي</span>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // دالة تبديل الثيم
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // استرجاع الثيم المحفوظ عند فتح الصفحة وتشغيل جلب الغرف
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            fetchRooms();
        });

        async function fetchRooms() {
            try {
                const response = await fetch('/api/rooms');
                const rooms = await response.json();
                const container = document.getElementById('rooms-container');
                container.innerHTML = '';

                rooms.forEach(room => {
                    let statusBadge = room.status === 'متاح' 
                        ? '<span class="badge bg-success">متاح</span>' 
                        : `<span class="badge bg-danger">محجوز بواسطة: ${room.booked_by}</span>`;

                    let timeInfo = '';
                    if (room.status === 'محجوز' && room.start_time && room.end_time) {
                        let start = new Date(room.start_time);
                        let end = new Date(room.end_time);
                        timeInfo = `<p class="text-muted small mt-2">الوقت: ${formatTime(start)} إلى ${formatTime(end)}</p>`;
                    }

                    let actionForm = room.status === 'متاح' 
                        ? `
                            <form onsubmit="bookRoom(event, ${room.id})" class="mt-3">
                                <input type="text" placeholder="اسمك الكريم" id="name-${room.id}" class="form-control mb-2" required>
                                <label class="form-label small">وقت البداية:</label>
                                <input type="datetime-local" id="time-${room.id}" class="form-control mb-2" required>
                                
                                <label class="form-label small">مدة الحجز:</label>
                                <select id="duration-${room.id}" class="form-control mb-2">
                                    <option value="30">30 دقيقة</option>
                                    <option value="60" selected>ساعة واحدة</option>
                                    <option value="90">ساعة ونصف</option>
                                    <option value="120">ساعتان</option>
                                    <option value="180">3 ساعات (الحد الأقصى)</option>
                                </select>
                                
                                <button type="submit" class="btn btn-primary btn-sm w-100">تأكيد الحجز</button>
                            </form>
                          ` 
                        : `
                            <button onclick="cancelBooking(${room.id})" class="btn btn-outline-danger btn-sm w-100 mt-3">إلغاء الحجز</button>
                          `;

                    container.innerHTML += `
                        <div class="col-md-6 mb-4">
                            <div class="card shadow-sm h-100">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <h5 class="card-title">${room.name}</h5>
                                        <p class="card-text">${statusBadge}</p>
                                        ${timeInfo}
                                    </div>
                                    <div>${actionForm}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('خطأ في جلب القاعات:', error);
            }
        }

        function formatTime(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return `${date.toLocaleDateString()} ${hours}:${minutes} ${ampm}`;
        }

        async function bookRoom(event, roomId) {
            event.preventDefault();
            const userName = document.getElementById(`name-${roomId}`).value;
            const bookingTime = document.getElementById(`time-${roomId}`).value;
            const duration = document.getElementById(`duration-${roomId}`).value;

            const response = await fetch('/api/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_id: roomId, user_name: userName, booking_time: bookingTime, duration: duration })
            });

            const result = await response.json();
            if (result.success) {
                fetchRooms();
            } else {
                alert(result.message);
            }
        }

        async function cancelBooking(roomId) {
            if (!confirm('متأكد تبي تلغي الحجز؟')) return;

            const response = await fetch(`/api/cancel/${roomId}`, { method: 'POST' });
            const result = await response.json();
            if (result.success) {
                fetchRooms();
            } else {
                alert(result.message);
            }
        }
    </script>
</body>
</html>
